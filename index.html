    if(L.env==='hall'){const out=[];const xs=[-0.8,-0.4,0,0.4,0.8];for(let i=0;i<xs.length;i++){const ax=xs[i]*L.sw,ay=L.D.ceil-1,az=2.5;const tx=ax*0.55,tz=-3.2-Math.abs(xs[i])*1.5;const col=[1,0.93,0.8];

    if(Math.abs(cx)>1.1||Math.abs(cy)>1.1)continue;const d=Math.hypot(px-e[0],py-e[1],pz-e[2]);if(d>24)continue;L.push({sx:(cx*0.5+0.5)*W,sy:(1-(cy*0.5+0.5))*H,d,m});}

    x.globalAlpha=al;x.fillStyle=['#ff7a80','#6fe39a','#7aa8ff'][(o.m.grade||1)-1]||'#fff';x.fillRect(bx+3,by+bh/2-2,3,4);x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(t,o.sx+1,by+bh/2+0.5);}

/* ---------- input ---------- */
function bind(cv){const P=new Map();let down=null,moved=0,pinch=null;
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});down={b:e.button};moved=0;if(P.size===2){const v=[...P.values()];pinch={d:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)};}});
  cv.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);if(B.lock)return;
    if(P.size>=2&&pinch){const v=[...P.values()];const d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);B.zoom=clamp(B.zoom*pinch.d/Math.max(1,d),0.5,1.25);pinch.d=d;return;}
    const k=B.cam.fov/1.15/Math.max(300,cv.clientHeight);B.cam.yaw+=dx*k*1.15;B.cam.pitch=clamp(B.cam.pitch+dy*k,-1.25,1.2);if(B.cam.goal&&!B.cam.goal.walk)B.cam.goal=null;});
  const up=e=>{P.delete(e.pointerId);if(P.size<2)pinch=null;if(down&&moved<6&&P.size===0)click(e);if(!P.size)down=null;};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{P.delete(e.pointerId);pinch=null;down=null;});
  cv.addEventListener('wheel',e=>{e.preventDefault();if(B.lock)return;B.zoom=clamp(B.zoom*Math.exp(e.deltaY*0.0012),0.5,1.25);},{passive:false});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  function click(e){const r=cv.getBoundingClientRect();const ray=B.cam.ray(e.clientX-r.left,e.clientY-r.top,r.width,r.height);let best=null,bt=1e9;for(const p of B.picks){const t=rayAABB(ray,p);if(t>=0&&t<bt){bt=t;best=p;}}
    if(best&&S&&!B.busy){const m=(B.hall?B.hall.members:S.members).find(x=>x.id===best.id);if(m&&typeof memCard==='function'){try{popup('👤 '+m.name,memCard(m));}catch(err){}}return;}
    if(!canWalk()||!B.lay)return;const b=B.lay.bounds;if(ray.d[1]<-0.02){const tt=(b.y-ray.o[1])/ray.d[1];if(tt>0&&tt<40){const x=clamp(ray.o[0]+ray.d[0]*tt,b.x0,b.x1),z=clamp(ray.o[2]+ray.d[2]*tt,b.z0,b.z1);B.cam.fly({walk:1,p:[x,b.y+1.6,z]});}}}}

/* ---------- sound ---------- */
let AC=null,mus=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function startMusic(kind){if(B.mute||!ac())return;stopMusic();
  const base=233.08,prog=[[0,4,7],[7,11,14],[9,12,16],[5,9,12]],mel=[0,2,4,7,9,12,14,16];const master=AC.createGain();master.gain.value=kind==='practice'?0.03:0.055;master.connect(AC.destination);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=kind==='practice'?900:1400;lp.connect(master);
  let step=0;const beat=kind==='practice'?0.55:0.5;const tick=()=>{const t0=AC.currentTime+0.05,ch=prog[Math.floor(step/4)%4];
    if(step%4===0)ch.forEach((s,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=i===0?'triangle':'sawtooth';o.frequency.value=base*Math.pow(2,(s-12*(i===0?1:0))/12);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(0.2,t0+0.1);g.gain.linearRampToValueAtTime(0.0,t0+beat*4);o.connect(g);g.connect(lp);o.start(t0);o.stop(t0+beat*4+0.05);});
    if(kind!=='practice'||step%2===0){const n=mel[Math.floor(Math.random()*mel.length)];const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=base*2*Math.pow(2,(n+ch[0]%12)/12);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(0.14,t0+0.04);g.gain.exponentialRampToValueAtTime(0.001,t0+beat*0.95);o.connect(g);g.connect(lp);o.start(t0);o.stop(t0+beat);}
    step++;};tick();mus={iv:setInterval(tick,beat*1000),master};}
function stopMusic(){if(mus){clearInterval(mus.iv);try{mus.master.gain.setTargetAtTime(0,AC.currentTime,0.15);}catch(e){}mus=null;}}
// soft applause: many quiet, low-passed claps with gentle fade in/out
function cheer(sec,vol){if(B.mute||!ac())return;try{sec=sec||3;const sr=AC.sampleRate,len=Math.floor(sr*sec),buf=AC.createBuffer(2,len,sr);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);const rate=55;const n=Math.floor(rate*sec);for(let k=0;k<n;k++){const st=Math.floor(Math.random()*len),amp=0.15+Math.random()*0.35,dec=sr*(0.012+Math.random()*0.02);
      for(let i=0;i<dec*4&&st+i<len;i++)d[st+i]+=(Math.random()*2-1)*amp*Math.exp(-i/dec);}
    for(let i=0;i<len;i++){const a=Math.min(1,i/(sr*0.6)),b=Math.min(1,(len-i)/(sr*1.2));d[i]*=a*b*0.5;}}
  const s=AC.createBufferSource(),lp=AC.createBiquadFilter(),hp=AC.createBiquadFilter(),g=AC.createGain();lp.type='lowpass';lp.frequency.value=2200;hp.type='highpass';hp.frequency.value=300;g.gain.value=vol||0.22;
  s.buffer=buf;s.connect(hp);hp.connect(lp);lp.connect(g);g.connect(AC.destination);s.start();}catch(e){}}
function clap(){B.clapT=0.55;if(B.mute||!ac())return;try{const sr=AC.sampleRate;for(let r=0;r<3;r++){const len=Math.floor(sr*0.12),buf=AC.createBuffer(1,len,sr),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(sr*0.018));
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=1300;f.Q.value=0.7;g.gain.value=0.35;s.buffer=buf;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(AC.currentTime+r*0.17);}}catch(e){}
  if(B.hall)B.hall.clapBoost=1;}

function show(on,opts){if(B.bgm){B.bgm=null;document.body.classList.remove('b3bg');document.getElementById('b3wrap').style.opacity='';}B.on=on;document.body.classList.toggle('b3on',on);const o=opts||{};document.getElementById('b3back').style.display=o.back?'':'none';document.getElementById('b3views').style.display=o.views?'':'none';
  document.getElementById('b3title').textContent=o.title||'';document.getElementById('b3hint').style.display=o.back?'':'none';if(!on){stopMusic();B.lock=false;document.getElementById('b3dim').classList.remove('on');document.getElementById('b3big').classList.remove('on');document.querySelector('#b3big .in').innerHTML='';document.getElementById('b3bar').style.display='none';document.getElementById('b3ann').style.display='none';}}
function bar(html,dur,onDone,btn,extra){const el=document.getElementById('b3bar');let done=false,t0=performance.now();el.innerHTML=`<div class="b3c">${html}${dur?'<div class="bar" style="margin:8px 0"><i id="b3p" style="width:0%"></i></div>':''}<div style="display:flex;gap:8px">${extra||''}<button id="b3skip" style="flex:1">${btn||'スキップ'}</button></div></div>`;el.style.display='block';
  const fin=()=>{if(done)return;done=true;clearInterval(iv);el.style.display='none';el.innerHTML='';onDone&&onDone();};
  const iv=dur?setInterval(()=>{const k=(performance.now()-t0)/dur;const p=document.getElementById('b3p');if(p)p.style.width=Math.min(100,k*100)+'%';if(k>=1)fin();},100):0;document.getElementById('b3skip').onclick=fin;return fin;}
function phr(html){return String(html).split(/(<[^>]+>)/).map(seg=>{if(!seg||seg[0]==='<')return seg;return seg.replace(/[^、。！？!?」』…）\n]+[、。！？!?」』…）]*|\n/g,m=>m==='\n'?'<br>':`<span class="ph">${m}</span>`);}).join('');}

function perform(o,done){B.busy=true;B.lock=false;B.hall={design:o.design,members:o.members.slice(),banner:o.banner,playing:false,stand:false,bow:0,clap:false,noHand:true,aud:!!o.audience,enterAt:performance.now()/1000+0.6};

  window.tName=()=>(S&&S.teacher)?S.teacher+'先生':'先生';
  const _ng=newGame;newGame=function(){const el=document.getElementById('tn');const tn=((el&&el.value)||TNAME||'').trim();
    if(el){if(!tn){popup('入力','あなたの名前を入力してください。');return;}if(tn.length>8){popup('入力','名前は8文字までにしてください。');return;}if(ngCheck(tn)){popup('入力','この言葉は入力できません。');return;}}
    const r=_ng.apply(this,arguments);try{if(S){S.teacher=tn||S.teacher||'';S.arrive={y:S.date.y,m:S.date.m};}save&&save(0,true);}catch(e){}
    try{if(B3.ok)B3.intro(()=>{welcome();});}catch(e){}return r;};
  const REP=[[/全国|金賞|日本一|頂点|優勝|一番|1番|普門|てっぺん/,['全国…！はい、私たちも本気で目指します！','全国の舞台、いつか絶対に立ちたいです！ついていきます！']],
    [/楽し|笑顔|仲良|好き|わくわく|ワクワク|最高の思い出/,['楽しい部活にしましょう！みんな、よろしくね！','はい！みんなで楽しく音楽します！']],
    [/練習|努力|厳し|頑張|がんば|ガンバ|本気|気合/,['はい！練習、がんばります！','厳しい練習も、望むところです！']],
    [/音|響|ハーモニー|演奏|音楽|合奏|サウンド/,['最高の音を、先生と一緒に作りたいです！','先生の音楽、たくさん教えてください！']],
    [/よろしく|宜しく/,['こちらこそ、よろしくお願いします！']]];
  const REPD=['ありがとうございます！みんな、先生についていこう！','なんだか、すごく頼もしいです…！','先生の言葉、心に響きました！','はい！これからよろしくお願いします！'];
  async function welcome(){try{const nm=window.tName(),bucho=(S.members.find(m=>m.role==='部長')||S.members.slice().sort((a,b)=>b.grade-a.grade)[0]);
    B3.welStart();await B3.cream(false,900);await B3.welWalk();
    B3.welSet({pbow:1});setTimeout(()=>B3.welSet({pbow:0}),900);
    B3.welSet({pface:'cam'});const _pf=setTimeout(()=>B3.welSet({pface:'stu'}),1500);await B3.dlg('校長',`今日から吹奏楽部を見てもらうことになった、${nm}です。\n部長、ほら、あいさつして。`);
    B3.welSet({standId:bucho?bucho.id:null});{const bp=bucho&&B3.welPos(bucho.id);if(bp)B3.welLook(bp[0],1.4,bp[1]);}await new Promise(r=>setTimeout(r,700));
    await B3.dlg(`部長・${bucho?bucho.name:''}`,`${nm}、今日からよろしくお願いします！`);
    B3.welLook(0,1.0,-1.5);B3.welSet({stand:1});await new Promise(r=>setTimeout(r,650));B3.welSet({bow:1});setTimeout(()=>B3.welSet({bow:0}),1300);
    await B3.dlg('部員一同','よろしくお願いしますっ！',{auto:1400});
    const msg=await B3.ask(nm,'例：一緒に全国を目指そう！',v=>!v?'あいさつを入力してください。':ngCheck(v)?'この言葉は入力できません。':'');
    try{S.greet=msg;}catch(e){}
    await B3.dlg(nm,msg);
    let pool=REPD;for(const [re,arr] of REP){if(re.test(msg)){pool=arr;break;}}const rep=pool[Math.floor(Math.random()*pool.length)];
    B3.welSet({stand:0,standId:bucho?bucho.id:null});await B3.dlg(`部長・${bucho?bucho.name:''}`,rep);
    await B3.welEnd();render();await B3.cream(false,1000);}catch(e){console.error(e);try{B3.welEnd&&B3.welEnd();}catch(_){}render();B3.cream(false,500);}}
  window._welcome=welcome;
  try{const _gp=gradPop;gradPop=function(){const real=popup;popup=function(t,b){try{const a=S.arrive||{y:(S.date.m<4?S.date.y-1:S.date.y),m:4};let M=(S.date.y-a.y)*12+(S.date.m-a.m);if(M<1)M=1;
      if(M<12)b=String(b).replace('1年間、本当にありがとうございました','この'+M+'ヶ月間、本当にありがとうございました').replace('まだ1年。','まだ'+M+'ヶ月。');}catch(e){}return real.apply(this,[t,b]);};try{return _gp.apply(this,arguments);}finally{popup=real;}};}catch(e){}
  B3.init();render();
})();

</script></body></html>
